<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>PureTV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<script>
  // The look the home screen last had, before anything is drawn, so a night start doesn't flash the day one first.
  try {
    if (localStorage.getItem('puretv.night') === 'true') {
      document.documentElement.style.background = '#0B0B0D';
      document.body.className = 'night';
    }
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <img id="scenephoto" alt="">
    <canvas id="bgA" width="48" height="27"></canvas>
    <canvas id="bgB" width="48" height="27"></canvas>
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="weather-summary"></div>
      <div id="buttons"></div>
      <div id="cards"></div>
      <div id="clock"><span class="date"></span><span class="tshade"></span><span class="trim"></span><span class="time"></span><span class="tw"></span><span class="wline"></span></div>
      <img id="scenefront" alt="">
      <button id="wpill"></button>
      <div id="wpanel"></div>
    </div>
    <div id="platter"></div>
    <div id="tiles"></div>
    <div id="scenecredit"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="nav"></div><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="quick" class="layer sheet"><div class="box"></div></div>
  <div id="actions" class="layer sheet"><div class="box"></div></div>
  <div id="picker" class="layer sheet"><div class="box"></div></div>
  <div id="pin" class="layer sheet"><div class="box"></div></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
